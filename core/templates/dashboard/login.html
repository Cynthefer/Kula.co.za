{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Login | {{ site.company_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                kula: {
                    blue: '#1E73BE',
                    dark: '#2B2B2B',
                    grey: '#6B7280',
                    light: '#F3F4F6',
                },
            },
            fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
            },
        },
    },
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
{% if site.favicon %}<link rel="icon" href="{{ site.favicon.url }}">{% endif %}
</head>
<body class="min-h-screen bg-kula-dark flex items-center justify-center px-4 font-sans antialiased">

<div class="w-full max-w-md">
    <div class="text-center mb-8">
        {% if site.logo %}
        <img src="{{ site.logo_thumbnail.url }}" alt="{{ site.company_name }}" class="h-20 w-auto mx-auto mb-4">
        {% else %}
        <h1 class="text-3xl font-extrabold text-white mb-2">{{ site.company_name }}</h1>
        {% endif %}
        <p class="text-gray-400 text-sm">{{ site.tagline }}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-2xl p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-extrabold text-kula-dark">Staff Login</h2>
            <p class="text-sm text-kula-grey mt-1">Sign in to manage site content.</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold text-kula-dark mb-2">Username</label>
                <div class="relative">
                    <i data-lucide="user" class="w-5 h-5 text-kula-grey absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" name="username" required autofocus
                           class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 focus:border-kula-blue focus:ring-kula-blue outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-kula-dark mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 text-kula-grey absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="password" name="password" id="password" required
                           class="w-full pl-11 pr-12 py-3 rounded-lg border border-gray-300 focus:border-kula-blue focus:ring-kula-blue outline-none transition">
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-kula-grey hover:text-kula-blue">
                        <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-kula-blue hover:bg-kula-dark text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
                Sign In
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'home' %}" class="text-sm text-kula-grey hover:text-kula-blue">← Back to site</a>
        </div>
    </div>
</div>

<script>
lucide.createIcons();
const notyf = new Notyf({ duration: 3000, position: { x: 'right', y: 'top' } });

function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.setAttribute('data-lucide', input.type === 'password' ? 'eye' : 'eye-off');
    lucide.createIcons();
}

{% if messages %}
{% for message in messages %}
notyf.error('{{ message|escapejs }}');
{% endfor %}
{% endif %}
</script>
</body>
</html>
