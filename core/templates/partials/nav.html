<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-kula-light">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between items-center h-20">
<a href="{% url 'home' %}" class="flex items-center gap-3">
{% if site.logo %}
<img src="{{ site.logo_thumbnail.url }}" alt="{{ site.company_name }}" class="h-12 w-auto">
{% else %}
<span class="text-2xl font-extrabold text-kula-blue">{{ site.company_name }}</span>
{% endif %}
<div class="hidden md:block">
<div class="text-lg font-bold text-kula-blue leading-tight">{{ site.company_name }}</div>
<div class="text-xs text-kula-grey tracking-wide">{{ site.tagline }}</div>
</div>
</a>

<nav class="hidden lg:flex items-center gap-8">
<a href="{% url 'home' %}" class="text-sm font-medium text-kula-dark hover:text-kula-blue transition">Home</a>
<a href="{% url 'about' %}" class="text-sm font-medium text-kula-dark hover:text-kula-blue transition">About</a>
<a href="{% url 'services' %}" class="text-sm font-medium text-kula-dark hover:text-kula-blue transition">Services</a>
<a href="{% url 'equipment' %}" class="text-sm font-medium text-kula-dark hover:text-kula-blue transition">Equipment</a>
<a href="{% url 'contact' %}" class="text-sm font-medium text-kula-dark hover:text-kula-blue transition">Contact</a>
</nav>

<div class="hidden lg:flex items-center gap-4">
<a href="tel:{{ site.phone_primary }}" class="flex items-center gap-2 text-sm text-kula-grey hover:text-kula-blue">
<i data-lucide="phone" class="w-4 h-4"></i>
{{ site.phone_primary }}
</a>
<a href="{% url 'contact' %}" class="bg-kula-blue hover:bg-kula-dark text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition">Get a Quote</a>
</div>

<button @click="mobileNav = !mobileNav" class="lg:hidden text-kula-dark">
<i data-lucide="menu" class="w-7 h-7"></i>
</button>
</div>
</div>

<div x-show="mobileNav" x-transition class="lg:hidden border-t border-kula-light bg-white">
<div class="px-4 py-4 space-y-3">
<a href="{% url 'home' %}" class="block py-2 text-kula-dark hover:text-kula-blue">Home</a>
<a href="{% url 'about' %}" class="block py-2 text-kula-dark hover:text-kula-blue">About</a>
<a href="{% url 'services' %}" class="block py-2 text-kula-dark hover:text-kula-blue">Services</a>
<a href="{% url 'equipment' %}" class="block py-2 text-kula-dark hover:text-kula-blue">Equipment</a>
<a href="{% url 'contact' %}" class="block py-2 text-kula-dark hover:text-kula-blue">Contact</a>
<a href="tel:{{ site.phone_primary }}" class="block py-2 text-kula-blue font-semibold">{{ site.phone_primary }}</a>
</div>
</div>
</header>
